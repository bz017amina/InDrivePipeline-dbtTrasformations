version: 2

models:
  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: stg_stores
    columns:
      - name: store_id
        tests: [unique, not_null]
  - name: stg_checkout_items
    columns:
      - name: order_id
        tests: [not_null]
      - name: quantity
        tests: [not_null]